<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Aja Assistant</title>
    <style>
        body { width: 250px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; margin: 0; background: #121212; color: #fff; text-align: center; }
        h3 { margin-top: 0; color: #3b82f6; }
        p { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 10px; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .danger { background: #ef4444; }
        .danger:hover { background: #dc2626; }
        .success { background: #10b981; }
        .success:hover { background: #059669; }
        #status-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #10b981; margin-right: 5px; }
    </style>
</head>
<body>
    <h3><span id="status-indicator"></span>Aja Assistant</h3>
    <p>Suite de Produtividade Genesys</p>
    
    <button id="btn-toggle">Desativar Temporariamente</button>
    <button id="btn-admin" class="success">Acessar Admin Dashboard</button>
    <button id="btn-reload" class="danger">Recarregar Genesys</button>
    
    <script src="popup.js"></script>
</body>
</html>
